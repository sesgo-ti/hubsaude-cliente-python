name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # Os testes de PKCS#11 rodam contra um HSM em software real
      # (SoftHSM2), não mockado — precisa estar instalado no runner. O
      # caminho do módulo (`libsofthsm2.so`) varia por distribuição, por
      # isso é descoberto dinamicamente em vez de hardcoded (ver
      # `SOFTHSM_LIB` em tests/pkcs11_softhsm_helper.py).
      - name: Instalar SoftHSM2
        run: |
          sudo apt-get update
          sudo apt-get install -y softhsm2
          # O módulo PKCS#11 (libsofthsm2.so) pertence ao pacote
          # `libsofthsm2` (dependência de `softhsm2`, que só traz os
          # utilitários como `softhsm2-util`) — buscar em `softhsm2` aqui
          # encontra nada.
          lib="$(dpkg -L libsofthsm2 | grep -m1 'libsofthsm2\.so$')"
          test -n "$lib" || { echo "libsofthsm2.so não encontrado" >&2; exit 1; }
          echo "SOFTHSM_LIB=$lib" >> "$GITHUB_ENV"

      - name: Instalar tox
        run: pip install tox

      - name: Testes e cobertura
        run: tox -e py312

      - name: Lint, formatação e checagem de tipos
        run: tox -e lint

      - name: Dependências e SAST
        run: tox -e security

      - name: Regras arquiteturais
        run: tox -e archrules

      - name: Publicar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore
