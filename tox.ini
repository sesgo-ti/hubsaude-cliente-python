[tox]
envlist = py312, lint, security
isolated_build = true

[testenv]
description = Executa a suíte de testes com cobertura, excluindo os markers "integration" e "quarantine"
extras = hsm
deps =
    pytest
    pytest-cov
commands =
    pytest -m "not integration and not quarantine" --cov=hubsaude_client --cov-report=term-missing --cov-fail-under=85 {posargs}

[testenv:integration]
description = Executa a suíte de integração real contra o simulador
extras = hsm
deps =
    pytest
passenv =
    HUBSAUDE_SIMULADOR_JAR
commands =
    pytest -m integration -v
# Pré-requisitos (senão os testes ficam SKIPPED, nao falham):
#   - Java 21+ no PATH;
#   - HUBSAUDE_SIMULADOR_JAR apontando para o hubsaude-simulador.jar executavel.

[testenv:lint]
description = Lint, formatação e checagem de tipos
deps =
    ruff
    black
    mypy
commands =
    ruff check src tests
    black --check src tests
    mypy src

[testenv:security]
description = Checagem de dependências e SAST
deps =
    pip-audit
    bandit
commands =
    pip-audit --strict --local {toxinidir}
    bandit -c pyproject.toml -r src

[testenv:archrules]
description = Regras arquiteturais bloqueantes
deps =
    import-linter
commands =
    lint-imports