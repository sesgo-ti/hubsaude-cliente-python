[tox]
envlist = py312, lint, security
isolated_build = true

[testenv]
description = Executa a suíte de testes com cobertura, excluindo os markers "integration" e "quarantine"
extras = hsm
deps =
    pytest
    pytest-cov
# Caminho do módulo PKCS#11 do SoftHSM2, quando o ambiente quiser
# apontá-lo explicitamente em vez de deixar a descoberta por candidatos
# de tests/pkcs11_softhsm_helper.py -- é o que o CI faz (`dpkg -L
# libsofthsm2`), já que o caminho varia por distribuição. Sem este
# passenv a variável não chegaria ao pytest: o tox isola o ambiente e só
# repassa a sua lista padrão.
passenv =
    SOFTHSM_LIB
commands =
    pytest -m "not integration and not quarantine" \
        --cov=hubsaude_client --cov-report=term-missing --cov-report=xml:coverage.xml \
        --junitxml=junit.xml --cov-fail-under=85 {posargs}

[testenv:integration]
description = Executa a suíte de integração real contra o simulador
extras = hsm
deps =
    pytest
passenv =
    HUBSAUDE_SIMULADOR_JAR
commands =
    pytest -m integration -v
# Pré-requisitos (senão os testes ficam SKIPPED, não falham):
#   - Java 21+ no PATH;
#   - HUBSAUDE_SIMULADOR_JAR apontando para o hubsaude-simulador.jar executável.

[testenv:lint]
description = Lint, formatação e checagem de tipos
deps =
    ruff
    black
    mypy
commands =
    ruff check src tests
    black --check src tests
    mypy src

[testenv:security]
description = Checagem de dependências e SAST
deps =
    pip-audit
    bandit
commands =
    pip-audit --strict --local {toxinidir}
    bandit -c pyproject.toml -r src

[testenv:archrules]
description = Regras arquiteturais bloqueantes
deps =
    import-linter
commands =
    lint-imports

[testenv:build]
description = Gera os artefatos de distribuição (sdist e wheel) em dist/
# O projeto não precisa estar instalado no ambiente: o "build" cria o
# seu próprio ambiente isolado de build (PEP 517) a partir do
# pyproject.toml.
skip_install = true
deps =
    build
commands =
    # dist/ não é limpo pelo "build"; sem isto, artefatos de uma versão
    # anterior sobrariam no diretório e entrariam na release junto com
    # os atuais (irrelevante no CI, que parte de um checkout limpo, mas
    # relevante em execução local).
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -m build

[testenv:sbom]
description = Gera o SBOM CycloneDX (sbom.json) das dependências de runtime
skip_install = true
deps =
    cyclonedx-bom
commands =
    # O SBOM precisa descrever só o que o usuário final recebe, ou seja,
    # as dependências de runtime (incluindo o extra "hsm"). Por isso o
    # ambiente inventariado é um venv auxiliar com apenas o pacote
    # instalado -- e não este próprio ambiente do tox, que também tem o
    # cyclonedx-bom e as dependências dele. "--without-pip" mantém o
    # próprio pip fora do inventário; a instalação é feita de fora, com
    # "pip --python", que aceita o diretório do venv (evita depender do
    # caminho do executável, que varia entre Linux/macOS e Windows).
    python -m venv {env_tmp_dir}{/}runtime --clear --without-pip
    python -m pip --python {env_tmp_dir}{/}runtime install --quiet .[hsm]
    # "--mc-type library": este pacote é uma biblioteca, não uma
    # aplicação (o padrão do cyclonedx-py). "--pyproject" preenche os
    # metadados do componente raiz (nome, versão, licença) a partir do
    # pyproject.toml.
    cyclonedx-py environment {env_tmp_dir}{/}runtime \
        --pyproject pyproject.toml \
        --mc-type library \
        --output-format JSON \
        --output-file sbom.json \
        --validate