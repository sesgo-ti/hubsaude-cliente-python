[tox]
envlist = py312, lint, security
isolated_build = true

[testenv]
description = Executa a suíte de testes com cobertura (equivalente a `mvn verify`)
deps =
    pytest
    pytest-cov
commands =
    pytest --cov=hubsaude_client --cov-report=term-missing --cov-fail-under=85

[testenv:lint]
description = Lint, formatação e checagem de tipos (equivalente a `mvn verify -Pquality`)
deps =
    ruff
    black
    mypy
commands =
    ruff check src tests
    black --check src tests
    mypy src

[testenv:security]
description = Checagem de dependências e SAST (equivalente a `mvn verify -Psecurity`)
deps =
    pip-audit
    bandit
commands =
    pip-audit --strict --local {toxinidir}
    bandit -c pyproject.toml -r src

[testenv:archrules]
description = Regras arquiteturais bloqueantes (equivalente ao ClientArchRules do ArchUnit)
deps =
    import-linter
commands =
    lint-imports