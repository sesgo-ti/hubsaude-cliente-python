[tox]
envlist = py312, lint, security
isolated_build = true

[testenv]
description = Executa a suíte de testes com cobertura, excluindo os markers "integration" e "quarantine"
extras = hsm
deps =
    pytest
    pytest-cov
# Caminho do módulo PKCS#11 do SoftHSM2 quando o ambiente quiser
# apontá-lo explicitamente (é o que o CI faz). Sem o passenv a variável
# não chegaria ao pytest.
passenv =
    SOFTHSM_LIB
commands =
    pytest -m "not integration and not quarantine" \
        --cov=hubsaude_client --cov-report=term-missing --cov-report=xml:coverage.xml \
        --junitxml=junit.xml --cov-fail-under=85 {posargs}

[testenv:integration]
description = Executa a suíte de integração real contra o simulador
extras = hsm
deps =
    pytest
passenv =
    HUBSAUDE_SIMULADOR_JAR
commands =
    pytest -m integration -v
# Pré-requisitos (senão os testes ficam SKIPPED, não falham):
#   - Java 21+ no PATH;
#   - HUBSAUDE_SIMULADOR_JAR apontando para o hubsaude-simulador.jar executável.

[testenv:lint]
description = Lint, formatação e checagem de tipos
deps =
    ruff
    black
    mypy
commands =
    ruff check src tests
    black --check src tests
    mypy src

[testenv:security]
description = Checagem de dependências e SAST
deps =
    pip-audit
    bandit
commands =
    pip-audit --strict --local {toxinidir}
    bandit -c pyproject.toml -r src

[testenv:archrules]
description = Regras arquiteturais bloqueantes
deps =
    import-linter
commands =
    lint-imports

[testenv:build]
description = Gera os artefatos de distribuição (sdist e wheel) em dist/
skip_install = true
deps =
    build
commands =
    # dist/ não é limpo pelo "build": sem isto, artefatos de uma versão
    # anterior entrariam na release junto com os atuais.
    python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
    python -m build

[testenv:sbom]
description = Gera o SBOM CycloneDX (sbom.json) das dependências de runtime
skip_install = true
deps =
    cyclonedx-bom
commands =
    # O SBOM deve descrever só o que o usuário final recebe: o ambiente
    # inventariado é um venv auxiliar apenas com o pacote, não este do
    # tox (que tem o cyclonedx-bom junto). "--without-pip" tira o pip do
    # inventário e "pip --python" aceita o diretório do venv, evitando
    # depender do caminho do executável, que varia por sistema.
    python -m venv {env_tmp_dir}{/}runtime --clear --without-pip
    python -m pip --python {env_tmp_dir}{/}runtime install --quiet .[hsm]
    cyclonedx-py environment {env_tmp_dir}{/}runtime \
        --pyproject pyproject.toml \
        --mc-type library \
        --output-format JSON \
        --output-file sbom.json \
        --validate
