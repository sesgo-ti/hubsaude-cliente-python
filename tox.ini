[tox]
envlist = py312, lint, security
isolated_build = true

[testenv]
description = Executa a suíte de testes com cobertura, excluindo os markers "integration" e "quarantine"
extras = hsm
deps =
    pytest
    pytest-cov
# Caminho do módulo PKCS#11 do SoftHSM2, quando o ambiente quiser
# apontá-lo explicitamente em vez de deixar a descoberta por candidatos
# de tests/pkcs11_softhsm_helper.py -- é o que o CI faz (`dpkg -L
# libsofthsm2`), já que o caminho varia por distribuição. Sem este
# passenv a variável não chegaria ao pytest: o tox isola o ambiente e só
# repassa a sua lista padrão.
passenv =
    SOFTHSM_LIB
commands =
    pytest -m "not integration and not quarantine" \
        --cov=hubsaude_client --cov-report=term-missing --cov-report=xml:coverage.xml \
        --junitxml=junit.xml --cov-fail-under=85 {posargs}

[testenv:integration]
description = Executa a suíte de integração real contra o simulador
extras = hsm
deps =
    pytest
passenv =
    HUBSAUDE_SIMULADOR_JAR
commands =
    pytest -m integration -v
# Pré-requisitos (senão os testes ficam SKIPPED, não falham):
#   - Java 21+ no PATH;
#   - HUBSAUDE_SIMULADOR_JAR apontando para o hubsaude-simulador.jar executável.

[testenv:lint]
description = Lint, formatação e checagem de tipos
deps =
    ruff
    black
    mypy
commands =
    ruff check src tests
    black --check src tests
    mypy src

[testenv:security]
description = Checagem de dependências e SAST
deps =
    pip-audit
    bandit
commands =
    pip-audit --strict --local {toxinidir}
    bandit -c pyproject.toml -r src

[testenv:archrules]
description = Regras arquiteturais bloqueantes
deps =
    import-linter
commands =
    lint-imports