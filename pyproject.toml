########################################################################
# pyproject.toml
#
# Arquivo central de configuração do projeto: define metadados do
# pacote, dependências e a configuração das ferramentas de build,
# lint, formatação, análise estática e testes usadas no repositório.
########################################################################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hubsaude-client"
version = "0.1.0"
description = "Cliente Python SMART Backend Services (client_credentials + private_key_jwt) do HubSaude"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["httpx>=0.27", "cryptography>=41"]

[project.optional-dependencies]
hsm = ["python-pkcs11"]
dev = ["pytest", "pytest-cov", "ruff", "black", "mypy", "bandit", "pip-audit", "import-linter", "tox", "python-pkcs11"]

# Aponta onde fica o código-fonte do pacote (pasta "src") para o build hatchling.
[tool.hatch.build.targets.wheel]
packages = ["src/hubsaude_client"]


# ------------------------------------------------------------------
# [tool.ruff] / [tool.black]
# Regras de estilo e formatação de código. Ruff cobre lint +
# formatação; Black cobre só formatação, caso prefira separar.
# ------------------------------------------------------------------
[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]  # TODO: revisar e ampliar o conjunto de regras de lint

[tool.black]
line-length = 120
target-version = ["py312"]


# ------------------------------------------------------------------
# [tool.mypy]
# Verificação estática de tipos, para pegar erros antes da execução.
# ------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"


# ------------------------------------------------------------------
# [tool.bandit]
# Análise estática focada em padrões de código inseguro/bugs de
# segurança.
# ------------------------------------------------------------------
[tool.bandit]
# Só varre o código de produção, não os testes
targets = ["src"]
exclude_dirs = ["tests", ".venv", "dist"]

# Supressões globais de achados do bandit. Prefira
# "# nosec <código> -- justificativa" inline no código a adicionar
# itens aqui; use esta lista só para casos amplos e comprovadamente
# aceitáveis em todo o projeto.
skips = []  # TODO: revisar se ha supressoes globais realmente necessarias

[tool.bandit.assert_used]
# B101 (uso de "assert"): esperado em arquivos de teste, não em produção
skips = ["*_test.py", "test_*.py"]


# ------------------------------------------------------------------
# [tool.pylint]
# Regras de qualidade/boas práticas de código, code smells,
# complexidade, etc. O Ruff cobre mais lint básico/estilo, então o
# Pylint fica responsável pela parte de boas práticas mais profunda.
# ------------------------------------------------------------------
# [tool.pylint.main]
# # TODO: definir o conjunto de regras de boas praticas desejado
#
# [tool.pylint."messages control"]
# disable = []


# ------------------------------------------------------------------
# Segurança de dependências
# Escaneamento de vulnerabilidades conhecidas nas dependências do
# projeto via pip-audit, com supressões em arquivo próprio (não
# dentro do pyproject.toml): ver pip-audit-suppressions.toml.
# ------------------------------------------------------------------


# ------------------------------------------------------------------
# [tool.pytest.ini_options]
# Configuração de execução dos testes.
# ------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]


# ------------------------------------------------------------------
# [tool.importlinter]
# Regra arquitetural: os modulos de assinatura/criptografia nao podem
# depender do cliente HTTP. Sem pacote proprio (estrutura de modulos
# achatada, ver ADR sobre layout do pacote) -- por isso os modulos sao
# listados individualmente e a lista cresce conforme novos modulos de
# assinatura sao adicionados.
# ------------------------------------------------------------------
[tool.importlinter]
root_package = "hubsaude_client"
# Necessario porque o modulo proibido (httpx) e externo ao root_package;
# sem isso, import-linter recusa validar contratos "forbidden" contra
# pacotes de fora de "hubsaude_client".
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Modulos de assinatura nao dependem de HTTP"
type = "forbidden"
source_modules = [
    "hubsaude_client.algorithms",
    "hubsaude_client.pem_loader",
    "hubsaude_client.private_key_signing_strategy",
    "hubsaude_client.key_certificate_consistency",
    "hubsaude_client.strategy_factory",
]
forbidden_modules = ["httpx"]